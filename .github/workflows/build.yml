name: Build ApkBridge (Android Host + iOS Hub)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Host APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android Host Release APK (debug-signed for instant ADB install)
        working-directory: android-host
        run: gradle assembleRelease --no-daemon

      - name: Copy & Rename APK
        working-directory: android-host
        run: |
          cp app/build/outputs/apk/release/app-release.apk ../ApkBridgeHost.apk
          ls -lh ../ApkBridgeHost.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApkBridgeHost-APK
          path: ApkBridgeHost.apk
          if-no-files-found: error

  build-ios:
    name: Build Unsigned iOS Hub IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios-hub
        run: xcodegen generate

      - name: Build Unsigned Release App
        working-directory: ios-hub
        run: |
          xcodebuild clean build \
            -project ApkBridgeHub.xcodeproj \
            -scheme ApkBridgeHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package ApkBridgeHub-Unsigned.ipa
        working-directory: ios-hub
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ApkBridgeHub.app Payload/ApkBridgeHub.app
          zip -r9 -y ../ApkBridgeHub-Unsigned.ipa Payload
          ls -lh ../ApkBridgeHub-Unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApkBridgeHub-Unsigned-IPA
          path: ApkBridgeHub-Unsigned.ipa
          if-no-files-found: error
