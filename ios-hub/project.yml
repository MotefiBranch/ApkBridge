name: ApkBridgeHub
options:
  bundleIdPrefix: com.apkbridge
  deploymentTarget:
    iOS: "16.0"

targets:
  ApkBridgeHub:
    type: application
    platform: iOS
    sources:
      - path: ApkBridgeHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apkbridge.hub
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "ApkBridge Hub discovers and streams apps from your Android host over local Wi-Fi."
        INFOPLIST_KEY_NSBonjourServices:
          - "_apkbridge._tcp"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
