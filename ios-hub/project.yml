name: ApkBridgeHub
options:
  bundleIdPrefix: com.apkbridge
  deploymentTarget:
    iOS: "16.0"

targets:
  ApkBridgeHub:
    type: application
    platform: iOS
    sources:
      - path: ApkBridgeHub
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apkbridge.hub
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ApkBridgeHub/Info.plist
